[project]
name = "todesk-mqtt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "i314q159", email = "i314q159@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "paho-mqtt>=2.1.0",
    "tomli>=2.5.0",
]

[project.scripts]
